<header class="bg-white border-bottom px-3 px-md-4 py-3">
  <div class="d-flex align-items-center gap-3">
    <button type="button"
            class="btn btn-light d-md-none"
            data-bs-toggle="offcanvas"
            data-bs-target="#portalSidebar"
            aria-controls="portalSidebar"
            aria-label="Open menu">
      <fa-icon [icon]="faBars"></fa-icon>
    </button>

    <div class="flex-grow-1">
      @if(showSearch()){
      <div class="input-group top-bar-search">
        <span class="input-group-text bg-white">
          <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
        </span>

        <input type="search"
               class="form-control"
               [value]="searchValue()"
               [placeholder]="searchPlaceholder()"
               (input)="onSearch($any($event.target).value)">
      </div>
      }
    </div>

    <div class="d-flex align-items-center gap-2 gap-md-3">
      @for(item of actions;track item.label){
      <app-button class="top-bar-action"
                  variant="light">
        <fa-icon [icon]="item.icon"></fa-icon>
      </app-button>
      }
    </div>
  </div>
</header>
