<div class="card">

  <div class="card-header bg-white py-3">
    <h5 class="fw-bold mb-0">
      Plan Details
    </h5>
  </div>

  <div class="card-body">

    <div class="row g-3">

      @for(field of fields;track field.control){

      <div class="col-12 col-md-6">

        <app-editor [label]="field.label"
                    [type]="field.type"
                    [control]="control(field.control)"
                    [placeholder]="field.placeholder"
                    [requiredMark]="field.requiredMark"
                    [errorMessage]="field.errorMessage"
                    [min]="field.min"
                    [step]="field.step">
        </app-editor>

      </div>

      }

      <div class="col-12 col-md-6">

        <label class="form-label fw-semibold">
          Status
        </label>

        <div class="form-check">

          <input id="planIsPublished"
                 type="checkbox"
                 class="form-check-input"
                 [formControl]="publishedControl()">

          <label for="planIsPublished"
                 class="form-check-label">
            IsPublished
          </label>

        </div>

        @if(!viewMode()){

        <small class="text-secondary d-block mt-1">
          Ticked means true, unticked means false.
        </small>

        }

      </div>

    </div>

  </div>

</div>
