<div class="card">

  <div class="card-header bg-white py-3">
    <h5 class="fw-bold mb-0">
      <fa-icon [icon]="impactIcon"
               class="me-2">
      </fa-icon>

      Projected Impact
    </h5>
  </div>

  <div class="card-body">

    <div class="d-flex justify-content-between gap-3 py-3 border-bottom">
      <span class="text-secondary">
        Original End Date
      </span>

      <span class="fw-semibold">
        {{formatDate(originalEndDate())}}
      </span>
    </div>

    <div class="d-flex justify-content-between gap-3 py-3 border-bottom">
      <span class="text-secondary">
        Freeze Duration
      </span>

      <span class="fw-semibold">
        {{duration()}}
      </span>
    </div>

    <div class="bg-primary-subtle border rounded p-3 my-3">
      <div class="d-flex justify-content-between align-items-center gap-3">
        <span class="fw-semibold">
          New End Date
        </span>

        <span class="fw-bold text-primary-emphasis">
          {{formatDate(newEndDate())}}
        </span>
      </div>
    </div>

    <p class="small text-secondary">
      Billing will automatically pause during the freeze period and resume upon reactivation.
    </p>

  </div>

  <div class="card-footer bg-white d-grid gap-2 py-3">

    <app-button class="d-grid"
                variant="primary"
                [disabled]="!canConfirm()||saving()"
                (clicked)="confirm.emit()">
      <span class="fw-semibold">
        <fa-icon [icon]="freezeIcon"
                 class="me-2">
        </fa-icon>

        {{saving()?'Freezing...':'Confirm Freeze'}}
      </span>
    </app-button>

    <app-button class="d-grid"
                variant="outline-secondary"
                [disabled]="saving()"
                (clicked)="cancel.emit()">
      Cancel
    </app-button>

  </div>
</div>
