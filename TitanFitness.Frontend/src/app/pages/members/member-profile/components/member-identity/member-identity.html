<div class="card">
  <div class="card-body p-4">

    <div class="position-relative w-50 mx-auto mb-3">

      <div class="ratio ratio-1x1 rounded-3 overflow-hidden bg-secondary-subtle">
        <app-member-photo [photo]="member().photo"
                          [alt]="member().fullName">
        </app-member-photo>
      </div>

      <div class="position-absolute top-0 end-0 m-2">
        <app-status-badge [status]="status()">
        </app-status-badge>
      </div>

    </div>

    <div class="text-center mb-4">
      <h5 class="fw-bold mb-1">
        {{member().fullName}}
      </h5>

      <span class="text-primary small">
        ID: {{member().membershipNumber}}
      </span>
    </div>

    <div class="d-grid gap-2 small">

      @if(member().email){
      <div class="d-flex align-items-center gap-2">
        <fa-icon [icon]="emailIcon"
                 class="text-secondary">
        </fa-icon>

        <span>{{member().email}}</span>
      </div>
      }

      @if(member().phone){
      <div class="d-flex align-items-center gap-2">
        <fa-icon [icon]="phoneIcon"
                 class="text-secondary">
        </fa-icon>

        <span>{{member().phone}}</span>
      </div>
      }

      @if(member().address){
      <div class="d-flex align-items-center gap-2">
        <fa-icon [icon]="locationIcon"
                 class="text-secondary">
        </fa-icon>

        <span>{{member().address}}</span>
      </div>
      }

      <div class="d-flex align-items-center gap-2">
        <fa-icon [icon]="dateIcon"
                 class="text-secondary">
        </fa-icon>

        <span>
          Joined: {{member().joinedDate|date:'MMM d, y'}}
        </span>
      </div>

    </div>

  </div>
</div>
